<style>
:root{--dk:#04323f;--gr:#12b39b;--lt:#2fd0b2;--bg:#f2f8f8;--bd:#d4e4e4;--mu:#5f8089}
body{font-family:Cairo,sans-serif;background:var(--bg);color:#0b2e38}
.glass{background:#fff;border:1px solid var(--bd);box-shadow:0 6px 24px rgba(4,50,63,.07)}
header.glass{background:var(--dk);border:0;box-shadow:0 4px 20px rgba(4,50,63,.25)}
.gold{background:linear-gradient(135deg,var(--gr),color-mix(in srgb,var(--gr) 80%,#000));color:#fff;font-weight:800}
.gt{background:linear-gradient(135deg,var(--dk),var(--gr));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.in{width:100%;padding:.6rem .9rem;background:#fff;border:1px solid #c3d7d7;border-radius:.75rem;font-size:.85rem;color:#0b2e38;outline:none}
.in:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(18,179,155,.15)}
.chip{padding:.5rem 1rem;border-radius:.75rem;font-size:.8rem;font-weight:700;white-space:nowrap;background:#fff;border:1px solid var(--bd);color:var(--dk)}
.chip.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.brand{font-family:Outfit,Cairo,sans-serif;font-weight:800;letter-spacing:-.02em;direction:ltr}
body .text-slate-300{color:#3e5f68}body .text-slate-400{color:var(--mu)}
body header .text-slate-400{color:#9fc7c9}
body .text-yellow-400{color:#0e9f8a}
body .bg-slate-900\/40,body .bg-slate-900\/60,body .bg-slate-900\/70{background:#eef6f6}
body .bg-slate-900\/80.cardbox{background:#eef6f6}
body .bg-slate-800{background:#e2eeee}
body .border-slate-700,body .border-slate-800{border-color:var(--bd)}
body .border-yellow-500\/20{border-color:rgba(18,179,155,.3)}
body .bg-yellow-500\/10{background:rgba(18,179,155,.1)}
body .text-emerald-300{color:#6ee7cf}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}header.glass{padding-top:env(safe-area-inset-top)}
@media(max-width:480px){.chip{padding:.45rem .7rem}}
button:focus-visible,a:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
</style>

window.addUrl=()=>{const el=$('iu'),v=el.value.trim();if(!/^https?:\/\//.test(v))return;if(ed.length>=F().maxImages)return alert(`باقتك تسمح بـ ${F().maxImages} صور لكل عقار.`);ed.push(v);el.value='';thumbs()};
window.upl=async el=>{const fs=[...el.files],max=F().maxImages;if(!fs.length)return;const up=$('up');up.classList.remove('hidden');let fail=0,n=0;
 for(const f of fs){if(ed.length>=max){alert(`باقتك تسمح بـ ${max} صور لكل عقار.`);break}n++;up.textContent=`جاري ضغط ورفع الصورة ${n} من ${fs.length}...`;const u=await fi(f);if(u){ed.push(u);thumbs()}else fail++}
 up.classList.add('hidden');el.value='';if(fail)alert(`تعذّر رفع ${fail} صورة. جرّب صورة أخرى.`)};
window.saveP=async(e,id)=>{
 e.preventDefault();
 const d={title:$('f_t').value.trim(),cat:$('f_c').value,status:$('f_s').value,vip:$('f_v').checked,price:num($('f_p').value),area:+$('f_a').value||0,beds:+$('f_b').value||0,baths:+$('f_h').value||0,park:+$('f_k').value||0,loc:$('f_l').value.trim(),imgs:ed.slice(),map:$('f_m').value.trim(),video:$('f_vd').value.trim(),tour:$('f_tr').value.trim(),desc:$('f_d').value.trim()};
 try{if(id)await update(ref(db,`${base}/properties/${id}`),d);else await push(ref(db,base+'/properties'),{...d,views:0,at:Date.now()});closeM()}catch(err){alert('فشل الحفظ: '+err.message)}
};
window.delP=id=>{if(confirm('حذف العقار نهائياً؟'))remove(ref(db,`${base}/properties/${id}`))};

const LL={new:'جديد',contacted:'تم التواصل',visit:'معاينة',closed:'مغلق'};
window.showLeads=()=>{
 if(!F().leads)return limit('متابعة العملاء المهتمين');
 const td=dk(),due=leads.filter(l=>l.fu&&l.fu<=td&&l.st!=='closed').length;
 modal(`<div class="flex justify-between items-center mb-3"><h3 class="font-black text-lg">العملاء المهتمون (${leads.length})</h3><button onclick="expLeads()" class="chip">⬇ Excel</button></div>${due?`<p class="text-xs bg-yellow-500/10 rounded-xl p-2 mb-3">⏰ لديك ${due} متابعة مستحقة اليوم أو متأخرة.</p>`:''}`+(leads.length?leads.map(l=>`
  <div class="bg-slate-900/70 rounded-xl p-3 mb-2 text-sm">
   <div class="flex justify-between"><b>${esc(l.name)}</b><span class="text-xs text-slate-400">${new Date(l.at).toLocaleDateString('ar-EG-u-nu-latn')}</span></div>
   <p class="text-xs text-slate-400 my-1">${esc(l.ptitle)}</p>
   ${l.visit?`<p class="text-xs mb-1" style="color:var(--gr)">📅 معاينة: ${esc(l.visit)} ${esc(l.slot||'')}</p>`:''}
   <div class="flex gap-2 items-center"><a href="https://wa.me/${esc(String(l.phone).replace(/\D/g,''))}" target="_blank" class="text-emerald-600 text-xs" dir="ltr">${esc(l.phone)}</a>
   <select onchange="setLead('${l.id}',this.value)" class="in !w-auto !py-1 mr-auto text-xs">${Object.entries(LL).map(([k,v])=>`<option value="${k}" ${l.st===k?'selected':''}>${v}</option>`).join('')}</select>
   <button onclick="delLead('${l.id}')" class="text-red-400 text-xs">حذف</button></div>
   <div class="grid grid-cols-2 gap-2 mt-2"><input value="${esc(l.note||'')}" placeholder="ملاحظة" onchange="setLeadF('${l.id}','note',this.value)" class="in !py-1.5 text-xs"><input type="date" value="${esc(l.fu||'')}" onchange="setLeadF('${l.id}','fu',this.value)" class="in !py-1.5 text-xs" title="موعد المتابعة"></div>
  </div>`).join(''):'<p class="text-slate-400 text-sm">لا يوجد عملاء بعد. سيظهرون هنا عند طلب معاينة.</p>'));
};
window.setLeadF=(id,k,v)=>update(ref(db,`${base}/leads/${id}`),{[k]:v});
window.expLeads=()=>{
 const rows=[['الاسم','الهاتف','العقار','الحالة','موعد المعاينة','موعد المتابعة','ملاحظة','التاريخ'],...leads.map(l=>[l.name,l.phone,l.ptitle,LL[l.st]||'',l.visit?l.visit+' '+(l.slot||''):'',l.fu||'',l.note||'',new Date(l.at).toLocaleDateString('en-GB')])];
 const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='leads-'+dk()+'.csv';a.click()};
window.setLead=(id,st)=>update(ref(db,`${base}/leads/${id}`),{st});
window.delLead=async id=>{await remove(ref(db,`${base}/leads/${id}`));showLeads()};

حتي العقارية':'My property page link','✓ موثّق':'✓ Verified'};
const RX=[[/ غرف$/,' beds'],[/ حمام$/,' baths'],[/ \/ شهرياً$/,' / month'],[/^عرض المزيد/,'Show more'],[/^مستشارك: /,'Agent: '],[/^مختارات أعدّها لك يا /,'Picks prepared for you, ']];
const ORI=new WeakMap();
function trText(n){const raw=ORI.has(n)?ORI.get(n):n.nodeValue,t=raw.trim();if(!t)return;
 if(LANG==='en'){let o=EN[t];if(!o)for(const[r,x]of RX)if(r.test(t)){o=t.replace(r,x);break}
  if(o){if(!ORI.has(n))ORI.set(n,n.nodeValue);const v=raw.replace(t,o);if(n.nodeValue!==v)n.nodeValue=v}}
 else if(ORI.has(n)){const v=ORI.get(n);ORI.delete(n);if(n.nodeValue!==v)n.nodeValue=v}}
function trAttr(e){for(const a of['placeholder','title']){const k='ar'+a;if(!e.hasAttribute(a))continue;const raw=e.dataset[k]??e.getAttribute(a);
  if(LANG==='en'&&EN[raw]){e.dataset[k]=raw;e.setAttribute(a,EN[raw])}else if(LANG!=='en'&&e.dataset[k]!==undefined){e.setAttribute(a,e.dataset[k]);delete e.dataset[k]}}}
function walk(r){if(r.nodeType===3)return trText(r);if(r.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(r.tagName))return;
 trAttr(r);r.querySelectorAll('[placeholder],[title]').forEach(trAttr);
 const w=document.createTreeWalker(r,4,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.tagName)?2:1});let n;while(n=w.nextNode())trText(n)}
window.toggleLang=()=>setLang(LANG==='en'?'ar':'en');
function setLang(l){LANG=l;LS.set('lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='en'?'ltr':'rtl';$('bLang').textContent=l==='en'?'ع':'EN';walk(document.body);render()}
new MutationObserver(ms=>{if(LANG!=='en')return;for(const m of ms){if(m.type==='characterData')trText(m.target);else m.addedNodes.forEach(walk)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
head();render();
if(LANG==='en')setLang('en');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
